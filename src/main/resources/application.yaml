spring:
  application:
    name: flowgoods
  flyway:
    enabled: true
    baseline-on-migrate: true
  mvc:
    problem-details:
      enabled: true
  config:
    import:
    - "classpath:errors/errors-user.yml"
    - "classpath:errors/errors-product.yml"
    - "classpath:errors/errors-jwt.yml"
    - "classpath:errors/errors-general.yml"
    - "classpath:errors/errors-password.yml"
  jpa:
    show-sql: true
