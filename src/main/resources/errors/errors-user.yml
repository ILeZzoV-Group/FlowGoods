app:
  exceptions:
    errors:
      user-not-found:
        status: 404
        title: "User Not Found"
        type: "https://api.ilezzov.ru/errors/user-not-found"
        message: "User with identifier {0} was not found"
      user-already-exists:
        status: 409
        title: "User Already Exists"
        type: "https://api.ilezzov.ru/errors/user-already-exists"
        message: "User with email {0} already exists"