# Nullability
jakarta.validation.constraints.NotNull.message=Value is required.
jakarta.validation.constraints.NotBlank.message=Must not be blank.
jakarta.validation.constraints.NotEmpty.message=Must not be empty.

# Size
jakarta.validation.constraints.Size.message=Length must be between {min} and {max} characters.

# Email and URL
jakarta.validation.constraints.Email.message=Must be a valid email address.
jakarta.validation.constraints.URL.message=Must be a valid URL.

# Numbers
jakarta.validation.constraints.Min.message=Must be greater than or equal to {value}.
jakarta.validation.constraints.Max.message=Must be less than or equal to {value}.
jakarta.validation.constraints.Positive.message=Must be a positive number.

# DateTime
jakarta.validation.constraints.Past.message=Must be a date in the past.
jakarta.validation.constraints.Future.message=Must be a date in the future.